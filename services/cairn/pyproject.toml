[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "heavy-rain-cairn"
version = "0.1.0"
description = "Heavy Rain Cairn weekly recurrence coordinator on google-antigravity 0.1.22 (gemini-4-argon high)"
requires-python = ">=3.11"
dependencies = [
    "google-antigravity==0.1.22",
    "pydantic>=2.9.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["cairn*"]
